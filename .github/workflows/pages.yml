# Render the static prototype (static/) with Quarto and deploy it to GitHub
# Pages. Needs Settings > Pages > Source set to "GitHub Actions".
#
# Only Quarto is needed: the data is the JSON committed in static/data, so
# after changing data/ run static/prep_static_data.R locally and commit the
# new JSON.
name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        working-directory: static
        run: quarto render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: static/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
